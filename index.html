<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本行程</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0392b">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wallpaper" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<button id="theme-toggle" aria-label="切换浅色/深色毛玻璃">🌙</button>
<header id="day-tabs"></header>
<main id="day-content"></main>
<button id="cache-maps-btn">离线缓存全部地图</button>
<div id="map"></div>
<div id="checklist-view" style="display:none"></div>
<nav id="bottom-nav">
  <button data-view="itinerary" class="active">行程</button>
  <button data-view="checklist">清单</button>
</nav>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
